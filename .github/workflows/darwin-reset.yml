name: Reset ProjectFlow evolution

on:
  workflow_dispatch:

concurrency:
  group: projectflow-reset
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  reset:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the measured baseline genome
        run: |
          git fetch --force origin refs/tags/demo-baseline:refs/tags/demo-baseline
          git restore --source demo-baseline -- \
            apps/projectflow/src/App.tsx \
            apps/projectflow/src/App.test.tsx \
            apps/projectflow/src/data.ts \
            apps/projectflow/src/styles.css
      - run: npm ci
      - name: Validate the restored baseline
        run: npm run verify
      - name: Record the restored baseline when the genome changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/projectflow/src/App.tsx \
              apps/projectflow/src/App.test.tsx \
              apps/projectflow/src/data.ts \
              apps/projectflow/src/styles.css
            git commit -m "chore: reset ProjectFlow to measured baseline"
            git push origin main
          fi
      - name: Build the restored measured target
        run: |
          export VITE_APP_VERSION="$(git rev-parse --short=12 HEAD)-baseline"
          npm run build
          cp apps/projectflow/dist/index.html apps/projectflow/dist/404.html
        env:
          VITE_API_BASE_URL: https://darwin-api.stevie-johnston.workers.dev
          VITE_BASE_PATH: /projectflow/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/projectflow/dist
      - name: Deploy the measured baseline
        id: deployment
        uses: actions/deploy-pages@v4
