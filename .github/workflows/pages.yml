name: Deploy ProjectFlow to Cloudflare

on:
  workflow_run:
    workflows: [ProjectFlow CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectflow-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the measured target
        run: |
          export VITE_APP_VERSION="$(git rev-parse --short=12 HEAD)"
          export VITE_COMMIT_SHA="$(git rev-parse HEAD)"
          npm run build
        env:
          VITE_API_BASE_URL: /api/darwin
          VITE_BASE_PATH: /
      - name: Deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.111.0 pages deploy apps/projectflow/dist \
            --project-name darwin-projectflow \
            --branch main \
            --commit-hash "$TARGET_SHA" \
            --commit-dirty=false
