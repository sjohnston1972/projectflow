name: Deploy ProjectFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: projectflow-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the measured target
        run: |
          export VITE_APP_VERSION="$(git rev-parse --short=12 HEAD)"
          npm run build
        env:
          VITE_API_BASE_URL: https://darwin-api.stevie-johnston.workers.dev
          VITE_BASE_PATH: /projectflow/
      - name: Add the single-page study fallback
        run: cp apps/projectflow/dist/index.html apps/projectflow/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/projectflow/dist
      - id: deployment
        uses: actions/deploy-pages@v4
