name: Deploy ProjectFlow to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectflow-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the measured target
        run: |
          export VITE_APP_VERSION="$(git rev-parse --short=12 HEAD)"
          npm run build
        env:
          VITE_API_BASE_URL: https://darwin-api.stevie-johnston.workers.dev
          VITE_BASE_PATH: /
      - name: Deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.111.0 pages deploy apps/projectflow/dist \
            --project-name darwin-projectflow \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
